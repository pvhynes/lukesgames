<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Emote Alien</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: radial-gradient(circle at top, #1b2550, #050816 65%);
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
      touch-action: none;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    .game-shell {
      width: min(100%, 860px);
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(20px, 5vw, 34px);
      letter-spacing: clamp(1px, 0.6vw, 3px);
      text-transform: uppercase;
      color: #8dfcff;
      text-shadow: 0 0 12px rgba(141, 252, 255, 0.7);
    }

    .hud {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 8px;
      align-items: center;
      width: min(100%, 800px);
      margin: 0 auto 8px;
      font-size: clamp(14px, 3.4vw, 18px);
    }

    .hud > :first-child {
      text-align: left;
    }

    .hud > :last-child {
      text-align: right;
    }

    .hint {
      color: #b9c1ff;
      font-size: clamp(11px, 2.8vw, 14px);
      white-space: nowrap;
    }

    .canvas-wrap {
      width: min(100%, 800px);
      margin: 0 auto;
      aspect-ratio: 4 / 3;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #020510;
      border: clamp(2px, 0.6vw, 3px) solid #8dfcff;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(141, 252, 255, 0.35);
    }

    .controls {
      display: none;
      grid-template-columns: 1fr 1fr 1.2fr;
      gap: 10px;
      width: min(100%, 800px);
      margin: 10px auto 0;
      user-select: none;
    }

    .touch-button,
    button {
      border: none;
      border-radius: 999px;
      background: rgba(141, 252, 255, 0.92);
      color: #07101f;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(141, 252, 255, 0.35);
    }

    .touch-button {
      min-height: 56px;
      font-size: 24px;
      touch-action: none;
    }

    .touch-button.fire {
      background: #fff36d;
    }

    button {
      margin-top: 12px;
      padding: 10px 18px;
      font-size: 15px;
    }

    button:hover,
    .touch-button:active {
      transform: translateY(-1px);
    }

    @media (hover: none), (pointer: coarse), (max-width: 760px) {
      body {
        align-items: flex-start;
      }

      .controls {
        display: grid;
      }

      .keyboard-only {
        display: none;
      }
    }

    @media (max-height: 720px) and (orientation: landscape) {
      body {
        padding: 6px;
      }

      h1 {
        display: none;
      }

      .hud {
        margin-bottom: 5px;
      }

      .game-shell {
        width: min(100%, 760px);
      }

      .canvas-wrap {
        width: min(78vh * 4 / 3, 100%);
        max-width: 760px;
      }

      .controls {
        grid-template-columns: 1fr 1fr 1.4fr;
        margin-top: 6px;
      }

      .touch-button {
        min-height: 44px;
        font-size: 20px;
      }

      button {
        margin-top: 6px;
        padding: 8px 14px;
      }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <h1>Emote Alien</h1>
    <div class="hud">
      <div>Score: <span id="score">0</span></div>
      <div class="hint"><span class="keyboard-only">Move: ← → or A D &nbsp; Shoot: Space</span><span class="mobile-only">Touch controls</span></div>
      <div>Lives: <span id="lives">3</span></div>
    </div>

    <div class="canvas-wrap">
      <canvas id="game" width="800" height="600"></canvas>
    </div>

    <div class="controls" aria-label="Touch controls">
      <button class="touch-button" id="leftButton" aria-label="Move left">◀</button>
      <button class="touch-button" id="rightButton" aria-label="Move right">▶</button>
      <button class="touch-button fire" id="fireButton" aria-label="Fire">FIRE</button>
    </div>

    <button id="restartButton">Restart Game</button>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const livesEl = document.getElementById("lives");
    const restartButton = document.getElementById("restartButton");
    const leftButton = document.getElementById("leftButton");
    const rightButton = document.getElementById("rightButton");
    const fireButton = document.getElementById("fireButton");

    const keys = new Set();
    const touchInput = {
      left: false,
      right: false,
      firing: false
    };

    let player;
    let bullets;
    let enemyBullets;
    let enemies;
    let particles;
    let stars;
    let score;
    let lives;
    let gameOver;
    let won;
    let enemyDirection;
    let enemyShootTimer;
    let lastTime;

    function resetGame() {
      player = {
        x: canvas.width / 2 - 24,
        y: canvas.height - 60,
        width: 48,
        height: 28,
        speed: 380,
        cooldown: 0
      };

      bullets = [];
      enemyBullets = [];
      enemies = [];
      particles = [];
      stars = createStars(90);
      score = 0;
      lives = 3;
      gameOver = false;
      won = false;
      enemyDirection = 1;
      enemyShootTimer = 0;
      lastTime = performance.now();

      createEnemies();
      updateHud();
    }

    function createStars(count) {
      const result = [];
      for (let i = 0; i < count; i++) {
        result.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 1.7 + 0.4,
          speed: Math.random() * 25 + 15
        });
      }
      return result;
    }

    function createEnemies() {
      const rows = 5;
      const cols = 10;
      const startX = 90;
      const startY = 70;
      const gapX = 58;
      const gapY = 44;

      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          enemies.push({
            x: startX + col * gapX,
            y: startY + row * gapY,
            width: 36,
            height: 26,
            alive: true,
            value: (rows - row) * 10
          });
        }
      }
    }

    function updateHud() {
      scoreEl.textContent = score;
      livesEl.textContent = lives;
    }

    function shoot() {
      if (player.cooldown <= 0 && !gameOver && !won) {
        bullets.push({
          x: player.x + player.width / 2 - 3,
          y: player.y - 12,
          width: 6,
          height: 16,
          speed: 520
        });
        player.cooldown = 0.28;
      }
    }

    function enemyShoot() {
      const aliveEnemies = enemies.filter(enemy => enemy.alive);
      if (aliveEnemies.length === 0) return;

      const shooter = aliveEnemies[Math.floor(Math.random() * aliveEnemies.length)];
      enemyBullets.push({
        x: shooter.x + shooter.width / 2 - 3,
        y: shooter.y + shooter.height,
        width: 6,
        height: 14,
        speed: 230
      });
    }

    function addExplosion(x, y, amount = 12) {
      for (let i = 0; i < amount; i++) {
        particles.push({
          x,
          y,
          vx: (Math.random() - 0.5) * 180,
          vy: (Math.random() - 0.5) * 180,
          life: Math.random() * 0.45 + 0.25,
          radius: Math.random() * 3 + 1
        });
      }
    }

    function rectsOverlap(a, b) {
      return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
      );
    }

    function update(dt) {
      stars.forEach(star => {
        star.y += star.speed * dt;
        if (star.y > canvas.height) {
          star.y = 0;
          star.x = Math.random() * canvas.width;
        }
      });

      particles = particles.filter(particle => particle.life > 0);
      particles.forEach(particle => {
        particle.x += particle.vx * dt;
        particle.y += particle.vy * dt;
        particle.life -= dt;
      });

      if (gameOver || won) return;

      const movingLeft = keys.has("ArrowLeft") || keys.has("a") || touchInput.left;
      const movingRight = keys.has("ArrowRight") || keys.has("d") || touchInput.right;

      if (movingLeft && !movingRight) {
        player.x -= player.speed * dt;
      }
      if (movingRight && !movingLeft) {
        player.x += player.speed * dt;
      }
      if (touchInput.firing) {
        shoot();
      }

      player.x = Math.max(12, Math.min(canvas.width - player.width - 12, player.x));
      player.cooldown -= dt;

      bullets.forEach(bullet => bullet.y -= bullet.speed * dt);
      bullets = bullets.filter(bullet => bullet.y + bullet.height > 0);

      enemyBullets.forEach(bullet => bullet.y += bullet.speed * dt);
      enemyBullets = enemyBullets.filter(bullet => bullet.y < canvas.height + 20);

      updateEnemies(dt);
      handleCollisions();

      enemyShootTimer -= dt;
      if (enemyShootTimer <= 0) {
        enemyShoot();
        enemyShootTimer = Math.max(0.35, 1.1 - score / 1000);
      }

      if (enemies.every(enemy => !enemy.alive)) {
        won = true;
      }
    }

    function updateEnemies(dt) {
      const aliveEnemies = enemies.filter(enemy => enemy.alive);
      if (aliveEnemies.length === 0) return;

      const speed = 52 + score * 0.03;
      let shouldDrop = false;

      aliveEnemies.forEach(enemy => {
        enemy.x += enemyDirection * speed * dt;
        if (enemy.x <= 18 || enemy.x + enemy.width >= canvas.width - 18) {
          shouldDrop = true;
        }
      });

      if (shouldDrop) {
        enemyDirection *= -1;
        aliveEnemies.forEach(enemy => {
          enemy.y += 24;
        });
      }

      if (aliveEnemies.some(enemy => enemy.y + enemy.height >= player.y)) {
        gameOver = true;
      }
    }

    function handleCollisions() {
      for (let i = bullets.length - 1; i >= 0; i--) {
        const bullet = bullets[i];

        for (const enemy of enemies) {
          if (enemy.alive && rectsOverlap(bullet, enemy)) {
            enemy.alive = false;
            bullets.splice(i, 1);
            score += enemy.value;
            addExplosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2);
            updateHud();
            break;
          }
        }
      }

      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const bullet = enemyBullets[i];
        if (rectsOverlap(bullet, player)) {
          enemyBullets.splice(i, 1);
          lives--;
          addExplosion(player.x + player.width / 2, player.y + player.height / 2, 20);
          updateHud();

          if (lives <= 0) {
            gameOver = true;
          }
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBackground();
      drawPlayer();
      drawBullets();
      drawEnemies();
      drawParticles();

      if (gameOver) {
        drawCenterMessage("Game Over", "Press Restart to try again");
      }

      if (won) {
        drawCenterMessage("You Win!", "Press Restart for another round");
      }
    }

    function drawBackground() {
      ctx.fillStyle = "#020510";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
      stars.forEach(star => {
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawPlayer() {
      ctx.fillStyle = "#8dfcff";
      ctx.beginPath();
      ctx.moveTo(player.x + player.width / 2, player.y);
      ctx.lineTo(player.x + player.width, player.y + player.height);
      ctx.lineTo(player.x, player.y + player.height);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(player.x + player.width / 2 - 4, player.y + 10, 8, 12);
    }

    function drawBullets() {
      ctx.fillStyle = "#fff36d";
      bullets.forEach(bullet => {
        ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
      });

      ctx.fillStyle = "#ff6d9e";
      enemyBullets.forEach(bullet => {
        ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
      });
    }

    function drawEnemies() {
      enemies.forEach(enemy => {
        if (!enemy.alive) return;

        ctx.fillStyle = "#9eff6d";
        ctx.fillRect(enemy.x, enemy.y + 8, enemy.width, enemy.height - 8);

        ctx.fillStyle = "#d6ffba";
        ctx.fillRect(enemy.x + 6, enemy.y, enemy.width - 12, 10);

        ctx.fillStyle = "#020510";
        ctx.fillRect(enemy.x + 8, enemy.y + 14, 5, 5);
        ctx.fillRect(enemy.x + enemy.width - 13, enemy.y + 14, 5, 5);
      });
    }

    function drawParticles() {
      particles.forEach(particle => {
        ctx.globalAlpha = Math.max(0, particle.life * 2);
        ctx.fillStyle = "#fff36d";
        ctx.beginPath();
        ctx.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      });
    }

    function drawCenterMessage(title, subtitle) {
      ctx.fillStyle = "rgba(0, 0, 0, 0.68)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.textAlign = "center";
      ctx.fillStyle = "#8dfcff";
      ctx.font = "bold 56px Arial";
      ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 20);

      ctx.fillStyle = "#ffffff";
      ctx.font = "22px Arial";
      ctx.fillText(subtitle, canvas.width / 2, canvas.height / 2 + 30);
      ctx.textAlign = "start";
    }

    function gameLoop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.033);
      lastTime = now;

      update(dt);
      draw();

      requestAnimationFrame(gameLoop);
    }

    function bindHoldButton(button, onPress, onRelease) {
      const press = event => {
        event.preventDefault();
        onPress();
      };

      const release = event => {
        event.preventDefault();
        onRelease();
      };

      button.addEventListener("pointerdown", press);
      button.addEventListener("pointerup", release);
      button.addEventListener("pointercancel", release);
      button.addEventListener("pointerleave", release);
    }

    window.addEventListener("keydown", event => {
      const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
      keys.add(key);

      if (event.code === "Space") {
        event.preventDefault();
        shoot();
      }
    });

    window.addEventListener("keyup", event => {
      const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
      keys.delete(key);
    });

    bindHoldButton(
      leftButton,
      () => { touchInput.left = true; },
      () => { touchInput.left = false; }
    );

    bindHoldButton(
      rightButton,
      () => { touchInput.right = true; },
      () => { touchInput.right = false; }
    );

    bindHoldButton(
      fireButton,
      () => {
        touchInput.firing = true;
        shoot();
      },
      () => { touchInput.firing = false; }
    );

    restartButton.addEventListener("click", resetGame);

    window.addEventListener("blur", () => {
      touchInput.left = false;
      touchInput.right = false;
      touchInput.firing = false;
      keys.clear();
    });

    resetGame();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
